version: '3.8'

services:
  frontend:
    build: ./client
    container_name: react-frontend
    image: node-frontend-image
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always

  api:
    build: ./server
    container_name: node-backend
    image: node-backend-image
    env_file:
      - ./server/.env
    ports:
      - "5000:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: myname123
      DB_NAME: todolist
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: sql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "myname123"
      MYSQL_DATABASE: todolist
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
